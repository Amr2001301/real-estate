# Build one company's own customer app (MA3) — a signed Android App Bundle
# ready to upload to Google Play.
#
# Run it from Actions → "Company app build" → Run workflow, and paste the
# company's build file: on the company's page in the super-admin dashboard,
# "تطبيق الشركة" → "نسخ ملف البناء" (the GET /v1/super-admin/companies/:id/mobile-app
# response). Nothing is committed; the AAB is attached to the run.
#
# Required GitHub secrets (repo Settings → Secrets → Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64  — the Play upload keystore (.jks), base64.
#                                     One upload key serves every company app
#                                     when Play App Signing is on (the default).
#   ANDROID_UPLOAD_STORE_PASSWORD   — its store password
#   ANDROID_UPLOAD_KEY_PASSWORD     — its key password
#   ANDROID_UPLOAD_KEY_ALIAS        — its key alias (e.g. upload)
#   FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON — google-services.json of the
#                                     customer Firebase project, downloaded
#                                     AFTER the company's package id was added
#                                     to it as an Android app (one file holds
#                                     every registered app).
name: Company app build

on:
  workflow_dispatch:
    inputs:
      config:
        description: "The company's build file (JSON) from the super-admin dashboard"
        required: true
        type: string
      version_name:
        description: 'Version shown in the store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: company-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android App Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile/mobile_customer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'

      - name: Prepare the company's name, icon and package id
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          printf '%s' "$CONFIG" > "$RUNNER_TEMP/company.json"
          python3 tool/prepare_company_app.py --config "$RUNNER_TEMP/company.json"
          echo "PACKAGE_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["app"]["packageId"])' "$RUNNER_TEMP/company.json")" >> "$GITHUB_ENV"
          echo "COMPANY_SLUG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["company"]["slug"])' "$RUNNER_TEMP/company.json")" >> "$GITHUB_ENV"

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          # The Google Services plugin fails the build when the package is not
          # registered — say so plainly instead.
          if ! grep -q "\"package_name\": *\"$PACKAGE_ID\"" android/app/google-services.json; then
            echo "::error::$PACKAGE_ID is not in google-services.json. Add it as an Android app in the customer Firebase project, download google-services.json again and update the FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON secret."
            exit 1
          fi

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::The ANDROID_UPLOAD_* secrets are not all set — the bundle would be signed with the debug key, which Play refuses."
            exit 1
          fi
          mkdir -p android/app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=keystore/upload-keystore.jks"
          } > android/key.properties

      - name: Resolve workspace deps
        working-directory: apps/mobile
        run: flutter pub get

      - name: Icons and splash
        run: |
          dart run flutter_launcher_icons -f build/company/flutter_launcher_icons.yaml
          dart run flutter_native_splash:create --path=build/company/flutter_native_splash.yaml

      - name: Build the App Bundle
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          # Play needs a higher versionCode on every upload: the run number grows.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version_name must look like 1.0.0"
            exit 1
          fi
          flutter build appbundle --release -t lib/main_prod.dart \
            --dart-define-from-file=build/company/dart_defines.json \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER"
          mv build/app/outputs/bundle/release/app-release.aab "build/${PACKAGE_ID}-${VERSION_NAME}-${BUILD_NUMBER}.aab"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.COMPANY_SLUG }}-android-${{ github.run_number }}
          path: apps/mobile/mobile_customer/build/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove the key from the runner
        if: always()
        run: rm -f android/key.properties android/app/keystore/upload-keystore.jks
