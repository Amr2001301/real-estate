name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run e2e nightly at 02:00 UTC to catch drift even without a PR.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suites to run (all = everything path-filtered + e2e; e2e-only = build + e2e only)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - e2e-only

# Cancel in-flight runs for the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Detect which directories changed so the heavier jobs below can self-skip
  # on PRs that don't touch them. GitHub Actions has no built-in job-level
  # `paths` filter — `dorny/paths-filter` produces boolean outputs we gate on.
  # ─────────────────────────────────────────────────────────────────────────────
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      webAdmin: ${{ steps.filter.outputs.webAdmin }}
      webPublic: ${{ steps.filter.outputs.webPublic }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared-types/**'
              - 'packages/tsconfig/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'
            webAdmin:
              - 'apps/web-admin/**'
              - 'packages/shared-types/**'
              - 'packages/tsconfig/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            webPublic:
              - 'apps/web-public/**'
              - 'packages/shared-types/**'
              - 'packages/tsconfig/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  # ─────────────────────────────────────────────────────────────────────────────
  # Existing always-run gate: lint + typecheck + build the whole workspace.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # An ephemeral Postgres is provided so that any Prisma schema-validation
    # step has somewhere to connect. NOTHING destructive runs against this DB —
    # we only verify that `prisma migrate status` is satisfied, never deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only; placeholder values. Each job gets a throwaway Postgres.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
      NODE_ENV: test
      # Min-length-16 placeholders that pass dev-mode env validation.
      JWT_ACCESS_SECRET: ci-access-secret-placeholder-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-1234567890

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate

      # Prove all committed migrations apply cleanly to a fresh database, then
      # verify no schema drift exists (schema.prisma out of sync with migrations).
      # Both commands must succeed — CI fails on migration error or drift.
      - name: Validate migration integrity
        working-directory: apps/api
        run: |
          npx prisma migrate deploy --schema=./prisma/schema.prisma
          npx prisma migrate status --schema=./prisma/schema.prisma

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend Jest unit tests (mocked Prisma). Fast. Only runs when api/ changes.
  # ─────────────────────────────────────────────────────────────────────────────
  api-unit:
    name: api · jest (unit)
    needs: [changes, build]
    if: >
      needs.changes.outputs.api == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite != 'e2e-only')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate
      - name: Run unit tests
        working-directory: apps/api
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_ACCESS_SECRET: ci-access-secret-placeholder-1234567890
          JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-1234567890
          # Unit tests use ConfigModule.forRoot({ isGlobal: true }) without Zod
          # validation, so Zod's default for REDIS_URL is not applied. Must be set
          # explicitly or ConfigService.getOrThrow('REDIS_URL') throws.
          REDIS_URL: redis://localhost:6379

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend Jest e2e — split into two parallel jobs so each stays under 20 min.
  #
  # 26 original spec files were merged into 6 to eliminate per-vm-context NestJS
  # boot overhead (~128 s per file). The two jobs divide those 6 files evenly:
  #   api-e2e-1: e2e-catalog-auth + e2e-reservations + e2e-financial
  #   api-e2e-2: e2e-maintenance + e2e-mt-security + e2e-isolated-apps
  #
  # Trigger policy: PRs to main, nightly schedule, and workflow_dispatch.
  # Push-to-main does NOT trigger e2e — the PR run has already validated the
  # branch before merge. The `all-checks-passed` gate accepts `skipped` on
  # push-to-main. workflow_dispatch (suite=all or suite=e2e-only) always runs
  # e2e regardless of path filter — useful for manual verification and bisect.
  #
  # DB-safety: globalSetup requires TEST_DATABASE_URL to contain "e2e" or "test".
  # Both jobs use separate Postgres service containers so they run in parallel.
  # ─────────────────────────────────────────────────────────────────────────────
  api-e2e-1:
    name: api · jest (e2e-1, real Postgres)
    needs: [changes, build]
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realestate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realestate_e2e?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_placeholder?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-placeholder-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-1234567890
      REDIS_URL: redis://localhost:6379
      DEFAULT_COMPANY_ID: 00000000-0000-0000-0000-000000000001
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate
      - name: Run e2e-1 (catalog-auth + reservations + financial)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json --runInBand --testPathPattern="e2e-catalog-auth|e2e-reservations|e2e-financial"

  api-e2e-2:
    name: api · jest (e2e-2, real Postgres)
    needs: [changes, build]
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realestate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realestate_e2e?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_placeholder?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-placeholder-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-1234567890
      REDIS_URL: redis://localhost:6379
      DEFAULT_COMPANY_ID: 00000000-0000-0000-0000-000000000001
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate
      - name: Run e2e-2 (maintenance + mt-security + isolated-apps)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json --runInBand --testPathPattern="e2e-maintenance|e2e-mt-security|e2e-isolated-apps"

  # ─────────────────────────────────────────────────────────────────────────────
  # Security test suite (real Postgres, real Nest app). Tests V-01..V-17 body-
  # supplied FK cross-tenant checks, $queryRaw guard, LeadScopeGuard, and the
  # full attack matrix. Runs whenever API code changes (same path filter as
  # api-unit). Mark `all-checks-passed` (below) as the required status check —
  # NOT this job directly — so docs-only PRs are not blocked by a skipped gate.
  # ─────────────────────────────────────────────────────────────────────────────
  api-security:
    name: api · jest (security, real Postgres)
    needs: [changes, build]
    if: >
      needs.changes.outputs.api == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite != 'e2e-only')
    runs-on: ubuntu-latest
    # 35 min: previous 20 min budget was exhausted (suite ran 19m19s, killed).
    # The cancelled job produced a partial Jest summary that was misread as a
    # real failure. 35 min gives a safe margin to get one complete, trustworthy
    # result. See docs/audit/06-ci-gaps.md G7.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realestate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realestate_e2e?schema=public
      # DATABASE_URL must differ from TEST_DATABASE_URL — globalSetup safety guard.
      # globalSetup overwrites this with TEST_DATABASE_URL at runtime.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_placeholder?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-placeholder-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-1234567890
      REDIS_URL: redis://localhost:6379
      # Required by TenantContextInterceptor for @Public() routes. See api-e2e
      # comment above for full rationale. WARNING: if DISABLE_DEFAULT_COMPANY_FALLBACK
      # is ever set to "true" in production, these jobs need X-Tenant-Slug headers.
      DEFAULT_COMPANY_ID: 00000000-0000-0000-0000-000000000001
      # Security tests share globalSetup with e2e: applies migrations + seeds
      # the Permission table. SEED_ADMIN_EMAIL must match the seed default.
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMe123!
      # MinIO (local S3-compatible storage) — same credentials as docker-compose.
      # Required for A9-2 and any other test that exercises the presigned-download
      # path. Without storage, the endpoint returns 503 before the auth check runs.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: real-estate-media
      R2_PUBLIC_URL: http://localhost:9000/real-estate-media
      R2_PRIVATE_BUCKET: real-estate-private
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate
      - name: Start MinIO and create buckets
        run: |
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z server /data
          until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done
          AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin AWS_DEFAULT_REGION=us-east-1 \
            aws s3 mb s3://real-estate-media --endpoint-url http://localhost:9000
          AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin AWS_DEFAULT_REGION=us-east-1 \
            aws s3 mb s3://real-estate-private --endpoint-url http://localhost:9000
      - name: Run security tests
        working-directory: apps/api
        run: pnpm exec jest -c test/jest-security.json --runInBand

  # ─────────────────────────────────────────────────────────────────────────────
  # web-public Jest unit tests (jsdom, no server deps). Covers analytics PII
  # blocking, middleware tenant-header spoofing, 403 narrowing, auth-actions,
  # and sitemap. No services needed. Runs when web-public paths change.
  # ─────────────────────────────────────────────────────────────────────────────
  web-public-unit:
    name: web-public · jest (unit)
    needs: [changes, build]
    if: >
      needs.changes.outputs.webPublic == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite != 'e2e-only')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        working-directory: apps/web-public
        run: pnpm test

  # ─────────────────────────────────────────────────────────────────────────────
  # Mobile static analysis + unit/widget tests across all 3 packages.
  # No emulator → no integration_test in CI (deferred).
  # ─────────────────────────────────────────────────────────────────────────────
  mobile-static:
    name: mobile · analyze + unit tests
    needs: [changes, build]
    if: >
      needs.changes.outputs.mobile == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite != 'e2e-only')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
      - name: Resolve workspace deps
        working-directory: apps/mobile
        run: flutter pub get
      - name: Inject Firebase config (customer)
        env:
          FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON }}
          FIREBASE_CUSTOMER_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_CUSTOMER_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON" ]; then
            echo "$FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON" > apps/mobile/mobile_customer/android/app/google-services.json
          fi
          if [ -n "$FIREBASE_CUSTOMER_GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$FIREBASE_CUSTOMER_GOOGLE_SERVICE_INFO_PLIST" > apps/mobile/mobile_customer/ios/Runner/GoogleService-Info.plist
          fi
      - name: Inject Firebase config (staff)
        env:
          FIREBASE_STAFF_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_STAFF_GOOGLE_SERVICES_JSON }}
          FIREBASE_STAFF_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_STAFF_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$FIREBASE_STAFF_GOOGLE_SERVICES_JSON" ]; then
            echo "$FIREBASE_STAFF_GOOGLE_SERVICES_JSON" > apps/mobile/mobile_staff/android/app/google-services.json
          fi
          if [ -n "$FIREBASE_STAFF_GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$FIREBASE_STAFF_GOOGLE_SERVICE_INFO_PLIST" > apps/mobile/mobile_staff/ios/Runner/GoogleService-Info.plist
          fi
      - name: Analyze core
        working-directory: apps/mobile/packages/core
        run: flutter analyze
      - name: Test core
        working-directory: apps/mobile/packages/core
        run: flutter test
      - name: Analyze customer
        working-directory: apps/mobile/mobile_customer
        run: flutter analyze
      - name: Test customer
        working-directory: apps/mobile/mobile_customer
        run: flutter test
      - name: Analyze staff
        working-directory: apps/mobile/mobile_staff
        run: flutter analyze
      - name: Test staff
        working-directory: apps/mobile/mobile_staff
        run: flutter test

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 7F — Web Admin Playwright suite.
  # Boots a Postgres + API + web-admin and runs the admin Playwright suite.
  # Auth-state pattern (Phase 7E) keeps the suite under the 5-req/min login
  # throttle no matter how the suite grows. The Flow B admin spec auto-skips
  # when `E2E_FLOW_B_NAME` is unset; the cross-app data path is covered by
  # the backend Flow B e2e spec, so this skip is documented and accepted.
  # Runs when the admin app OR the API changes (admin depends on the API).
  # ─────────────────────────────────────────────────────────────────────────────
  web-admin-e2e:
    name: web-admin · playwright
    needs: [changes, build]
    if: >
      needs.changes.outputs.webAdmin == 'true' ||
      needs.changes.outputs.api == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite != 'e2e-only')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realestate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # The API process below uses this DB. The TEST_DATABASE_URL safety guards
      # in `apps/api/test/globalSetup.ts` are NOT involved here (jest doesn't
      # run); we run `prisma migrate deploy + prisma:seed:e2e` manually instead.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realestate_e2e?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-placeholder-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-1234567890
      # API port is the default 4000 in CI (matches Playwright config's API
      # expectations); web-admin sits on 3001.
      API_BASE_URL: http://localhost:4000
      E2E_BASE_URL: http://localhost:3001
      E2E_NO_WEBSERVER: '1' # webServer not needed — we start it manually below
      # Required by TenantContextInterceptor for @Public() routes (admin login).
      # Seed pins the company to this UUID (prisma/seed.ts L385) so auth resolves.
      # node dist/main.js inherits this job-level env — no separate step env needed.
      # WARNING: docs/audit/06-ci-gaps.md G5 — coupling to DEFAULT_COMPANY fallback.
      DEFAULT_COMPANY_ID: 00000000-0000-0000-0000-000000000001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate

      - name: Apply migrations + seed e2e fixtures
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          pnpm prisma:seed:e2e

      - name: Build apps (Next.js prod builds are more stable for CI)
        run: pnpm -r build

      - name: Install Playwright Chromium
        working-directory: apps/web-admin
        run: pnpm exec playwright install --with-deps chromium

      - name: Start API (background, port 4000)
        working-directory: apps/api
        run: |
          PORT=4000 node dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          # Wait for /health
          for i in $(seq 1 60); do
            if curl -fs http://localhost:4000/health > /dev/null; then echo "API up"; break; fi
            sleep 2
          done
          curl -fs http://localhost:4000/health

      - name: Start web-admin (background, port 3001)
        working-directory: apps/web-admin
        run: |
          PORT=3001 pnpm start &
          echo $! > /tmp/web-admin.pid
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3001/login > /dev/null; then echo "web-admin up"; break; fi
            sleep 2
          done
          curl -fs http://localhost:3001/login

      - name: Run admin Playwright suite
        working-directory: apps/web-admin
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-admin-playwright-report
          path: apps/web-admin/playwright-report/
          retention-days: 7

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-admin-api-log
          path: /tmp/api.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 7F — Web Public Playwright suite.
  # Same shape as web-admin-e2e. The Flow B public spec submits the form
  # (it doesn't require admin coordination); the backend Flow B e2e is the
  # canonical "form → DB → admin sees it" assertion. The customer-portal
  # signed-download proof (Phase 7E) needs the e2e seed's contract / deposit
  # / maintenance rows, which the seed step above provides.
  # ─────────────────────────────────────────────────────────────────────────────
  web-public-e2e:
    name: web-public · playwright
    needs: [changes, build]
    if: >
      needs.changes.outputs.webPublic == 'true' ||
      needs.changes.outputs.api == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite != 'e2e-only')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realestate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realestate_e2e?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-placeholder-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-1234567890
      API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3002
      E2E_BASE_URL: http://localhost:3002
      E2E_NO_WEBSERVER: '1'
      # Required by TenantContextInterceptor for @Public() catalog routes.
      # Seed pins the company to this UUID (prisma/seed.ts L385) so catalog pages
      # resolve data instead of returning 503/spinning.
      # WARNING: docs/audit/06-ci-gaps.md G5 — coupling to DEFAULT_COMPANY fallback.
      DEFAULT_COMPANY_ID: 00000000-0000-0000-0000-000000000001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate

      - name: Apply migrations + seed e2e fixtures
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          pnpm prisma:seed:e2e

      - name: Build apps
        run: pnpm -r build

      - name: Install Playwright Chromium
        working-directory: apps/web-public
        run: pnpm exec playwright install --with-deps chromium

      - name: Start API (background, port 4000)
        working-directory: apps/api
        run: |
          PORT=4000 node dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            if curl -fs http://localhost:4000/health > /dev/null; then echo "API up"; break; fi
            sleep 2
          done
          curl -fs http://localhost:4000/health

      - name: Start web-public (background, port 3002)
        working-directory: apps/web-public
        run: |
          PORT=3002 pnpm start &
          echo $! > /tmp/web-public.pid
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3002/ > /dev/null; then echo "web-public up"; break; fi
            sleep 2
          done
          curl -fs http://localhost:3002/

      - name: Run public Playwright suite
        working-directory: apps/web-public
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-public-playwright-report
          path: apps/web-public/playwright-report/
          retention-days: 7

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-public-api-log
          path: /tmp/api.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Aggregate gate — always runs regardless of path filters. Mark THIS job
  # ("all checks passed") as the required status check in branch protection,
  # not the individual path-filtered jobs. It passes when every dependency
  # succeeded or was skipped; it fails when any dependency actually failed or
  # was cancelled. A docs-only PR skips every filtered job, leaving only
  # `build` (success) + skips → gate is green, merge is allowed.
  #
  # MAINTENANCE: every new CI job MUST be added to the `needs` list below.
  # A job omitted from this list runs invisibly — its result is never checked
  # and a failure will not block a merge. This repo has already had three
  # instances of unprotected suites: web-public tests hidden for weeks,
  # api-security which never executed in CI, and web-public-unit (added here).
  # If you add a job, wire it here or it does not protect anything.
  # ─────────────────────────────────────────────────────────────────────────────
  all-checks-passed:
    name: all checks passed
    runs-on: ubuntu-latest
    needs: [build, api-unit, api-e2e-1, api-e2e-2, api-security, mobile-static, web-admin-e2e, web-public-e2e, web-public-unit]
    if: always()
    steps:
      - name: Verify no job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All jobs passed or were skipped — gate green"
