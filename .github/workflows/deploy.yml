name: CD — Deploy to Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (api | web-admin | web-public | all)'
        required: false
        default: all

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Must be all-lowercase for Docker image tags (GHCR requirement).
  IMAGE_PREFIX: amr2001301/devora

jobs:
  # ─── Detect what changed (mirrors ci.yml) ────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      webAdmin: ${{ steps.filter.outputs.webAdmin }}
      webPublic: ${{ steps.filter.outputs.webPublic }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
            webAdmin:
              - 'apps/web-admin/**'
              - 'packages/**'
            webPublic:
              - 'apps/web-public/**'
              - 'packages/**'

  # ─── Deploy API ──────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' ||
      github.event.inputs.service == 'api' ||
      github.event.inputs.service == 'all'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Railway (API)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service api --yes
        continue-on-error: false

      - name: Rollback on failure
        if: failure()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          echo "Deploy failed — rolling back API service"
          railway rollback --service api --yes || true

  # ─── Deploy Web Admin ─────────────────────────────────────────────────────────
  deploy-web-admin:
    name: Deploy Web Admin
    needs: changes
    if: |
      needs.changes.outputs.webAdmin == 'true' ||
      needs.changes.outputs.api == 'true' ||
      github.event.inputs.service == 'web-admin' ||
      github.event.inputs.service == 'all'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-admin/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-admin:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-admin:${{ github.sha }}
          build-args: |
            API_BASE_URL=${{ secrets.API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Railway (Web Admin)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service web-admin --yes

      - name: Rollback on failure
        if: failure()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway rollback --service web-admin --yes || true

  # ─── Deploy Web Public ────────────────────────────────────────────────────────
  deploy-web-public:
    name: Deploy Web Public
    needs: changes
    if: |
      needs.changes.outputs.webPublic == 'true' ||
      needs.changes.outputs.api == 'true' ||
      github.event.inputs.service == 'web-public' ||
      github.event.inputs.service == 'all'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web Public image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-public/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-public:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-public:${{ github.sha }}
          build-args: |
            API_BASE_URL=${{ secrets.API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Railway (Web Public)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service web-public --yes

      - name: Rollback on failure
        if: failure()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway rollback --service web-public --yes || true
