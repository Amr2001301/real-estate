name: mobile_staff
description: "Real Estate — Staff App (Sales / Broker)."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  core:
    path: ../packages/core

  flutter_bloc: ^9.1.1
  go_router: ^14.6.2
  dio: ^5.7.0 # data layer (remote data sources) only

  # Firebase — push notifications, crash reporting + performance monitoring.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+8
  permission_handler: ^11.3.1
  # Displays system notifications while the app is in the foreground (FCM onMessage).
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Phase 7A — Staff App integration smoke (local/manual; not in CI yet).
  # See integration_test/smoke_test.dart and docs/system-qa-strategy.md.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/brand/devora-logo.png
