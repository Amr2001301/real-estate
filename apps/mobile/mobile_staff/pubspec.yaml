name: mobile_staff
description: "Real Estate — Staff App (Sales / Broker)."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  core:
    path: ../packages/core

  flutter_bloc: ^9.1.1
  go_router: ^14.6.2
  dio: ^5.7.0 # data layer (remote data sources) only

  # Firebase — push notifications, crash reporting + performance monitoring.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+8
  permission_handler: ^11.3.1
  # Displays system notifications while the app is in the foreground (FCM onMessage).
  flutter_local_notifications: ^18.0.1

  video_player: ^2.9.2
  cupertino_icons: ^1.0.8
  share_plus: ^10.1.2
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Phase 7A — Staff App integration smoke (local/manual; not in CI yet).
  # See integration_test/smoke_test.dart and docs/system-qa-strategy.md.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1726"
  adaptive_icon_foreground: "assets/brand/app_icon.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/brand/devora-logo.png
    - assets/brand/app_icon.png
    - assets/brand/flutter_native_splash.png
    - assets/brand/real_estate_video_splash.mp4

flutter_native_splash:
  background_image: assets/brand/flutter_native_splash.png
  background_image_dark: assets/brand/flutter_native_splash.png
  android_12:
    color: "#0B1726"
    image: assets/brand/flutter_native_splash.png
    icon_background_color: "#0B1726"
    color_dark: "#0B1726"
    image_dark: assets/brand/flutter_native_splash.png
    icon_background_color_dark: "#0B1726"
  fullscreen: true
  android: true
  ios: true
  web: false
