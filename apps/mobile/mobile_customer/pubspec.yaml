name: mobile_customer
description: "Real Estate — Customer App (Guest / Client / Customer)."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  core:
    path: ../packages/core

  flutter_bloc: ^8.1.6
  go_router: ^14.6.2
  dio: ^5.7.0 # data layer (remote data sources) only
  image_picker: ^1.1.2 # maintenance photo attachments (presentation platform service)
  file_picker: ^8.1.2 # P11.5 — PDF/image selection for payment-proof submission
  mime: ^1.0.5 # P11.5 — derive Content-Type from picked file extension

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Phase 7A — Customer App integration smoke (local/manual; not in CI yet).
  # See integration_test/smoke_test.dart and docs/system-qa-strategy.md.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/brand/devora-logo.png
