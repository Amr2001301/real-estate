name: mobile_customer
description: "Real Estate — Customer App (Guest / Client / Customer)."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  core:
    path: ../packages/core

  flutter_bloc: ^8.1.6
  go_router: ^14.6.2
  dio: ^5.7.0 # data layer (remote data sources) only
  image_picker: ^1.1.2 # maintenance photo attachments (presentation platform service)

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
