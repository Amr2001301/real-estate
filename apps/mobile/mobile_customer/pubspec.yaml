name: mobile_customer
description: "Real Estate — Customer App (Guest / Client / Customer)."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  core:
    path: ../packages/core

  flutter_bloc: ^8.1.6
  go_router: ^14.6.2
  dio: ^5.7.0 # data layer (remote data sources) only
  image_picker: ^1.1.2 # maintenance photo attachments (presentation platform service)
  file_picker: ^8.1.2 # P11.5 — PDF/image selection for payment-proof submission
  mime: ^1.0.5 # P11.5 — derive Content-Type from picked file extension
  video_player: ^2.9.2 # video splash screen

  # Firebase — Phase 5 push notifications.
  # Replace the stub lib/firebase_options.dart (generated by `flutterfire configure`)
  # and drop the real google-services.json / GoogleService-Info.plist to enable.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4
  # permission_handler is used by FirebasePushTokenProvider for iOS foreground permission.
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Phase 7A — Customer App integration smoke (local/manual; not in CI yet).
  # See integration_test/smoke_test.dart and docs/system-qa-strategy.md.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/brand/devora-logo.png
    - assets/brand/flutter_native_splash.png
    - assets/brand/real_estate_video_splash.mp4

flutter_native_splash:
  # background_image fills the entire screen on iOS and pre-Android-12.
  # Using `image` (the old key) only centres the asset as a small icon.
  background_image: assets/brand/flutter_native_splash.png
  background_image_dark: assets/brand/flutter_native_splash.png
  android_12:
    # Android 12+ has its own adaptive-icon splash API — centred icon only.
    color: "#0B1726"
    image: assets/brand/flutter_native_splash.png
    icon_background_color: "#0B1726"
    color_dark: "#0B1726"
    image_dark: assets/brand/flutter_native_splash.png
    icon_background_color_dark: "#0B1726"
  fullscreen: true
  android: true
  ios: true
  web: false
