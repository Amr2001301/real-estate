groups:
  - name: devora-api
    rules:
      - alert: APIDown
        expr: up{job="devora-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Devora API is down"
          description: "The API scrape target has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status_code=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate (>5%)"
          description: "More than 5% of requests are returning 5xx over the last 5 minutes."

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_ms_bucket[5m])
          ) > 2000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency exceeds 2 seconds"
          description: "The 95th-percentile response time has exceeded 2000ms for 2 minutes."
